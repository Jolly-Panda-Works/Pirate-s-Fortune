<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Treasure Raiders</title>

  <!-- Phase 0: stylesheet load order matters — base, layout, components, then overrides -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Orientation gate: populated in Phase 16 -->
  <div id="orientation-gate" class="orientation-gate" hidden>
    <p data-i18n="orientation.rotateDevice">Please rotate your device to landscape.</p>
  </div>

  <!-- Root mount point for the board. uiManager.js owns everything inside this
       node (GDD §19) — it only ever writes into the zone containers below,
       never structurally alters this shell. "Modals" (the 7th GDD §19 zone)
       is deliberately NOT a child here — it lives in the separate
       #modal-root node below, owned by modalManager.js (Prompt 014). -->
  <main id="app-root" class="app-root">
    <section id="zone-opponents" class="zone zone-opponents" aria-label="Opponents"></section>

    <section id="zone-treasure-deck" class="zone zone-treasure-deck" aria-label="Treasure Deck"></section>

    <section id="zone-expedition-area" class="zone zone-expedition-area" aria-label="Expedition Area"></section>

    <section id="zone-lost-loot" class="zone zone-lost-loot" aria-label="Lost Loot"></section>

    <section id="zone-actions" class="zone zone-actions" aria-label="Actions"></section>

    <section id="zone-ship-cargo" class="zone zone-ship-cargo" aria-label="Ship Cargo"></section>
  </main>

  <!-- Modal root: modalManager.js owns everything inside this node -->
  <div id="modal-root" class="modal-root"></div>

  <!-- ES module entry point. Everything else is imported from here. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
