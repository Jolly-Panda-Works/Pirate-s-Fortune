<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Treasure Raiders</title>

  <!-- Phase 23 (Prompt 023 — Web Release): these assets already existed
       under assets/icons/ but were never actually referenced anywhere
       (confirmed via grep across js/, css/, index.html before this
       prompt) — dead weight in the deployable static payload. icon.ico
       (102KB, pre-existing multi-resolution .ico) is lightweight enough
       to reference directly. icon.png (1.7MB, a 1254x1254 design
       source, NOT referenced directly — too large for a shipped web
       asset) is instead downscaled here into favicon-32.png (5KB) and
       apple-touch-icon.png (51KB); see assets/icons/ for how they were
       generated. -->
  <link rel="icon" href="assets/icons/icon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <!-- Phase 0: stylesheet load order matters — base, layout, components, then overrides -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Language switcher (Phase 15 — Prompt 016): simple EN/FA toggle,
       wired up by localizationManager.js's mountSwitcher(). Lives outside
       #app-root since it's not one of GDD §19's board zones and must stay
       reachable even before the board itself mounts. -->
  <div id="language-switcher" class="language-switcher" data-i18n-aria-label="language.switcherLabel">
    <button type="button" class="lang-button" data-lang="en" data-i18n="language.buttonEn">EN</button>
    <button type="button" class="lang-button" data-lang="fa" data-i18n="language.buttonFa">FA</button>
  </div>

  <!-- Audio controls (Phase 18 — Prompt 019): a single mute/unmute toggle,
       wired up by js/audioManager.js's mountMuteToggle(). Lives outside
       #app-root for the same reason #language-switcher does — not one of
       GDD §19's board zones, must stay reachable regardless of the board's
       own mount state. -->
  <div id="audio-controls" class="audio-controls" data-i18n-aria-label="audio.controlsLabel">
    <button type="button" id="audio-mute-toggle" class="mute-button" data-i18n="audio.muteButton">Mute</button>
  </div>

  <!-- Save controls (Phase 19 — Prompt 020): a single "Resume Game"
       button, hidden by default. main.js's bootstrap() unhides it only
       when saveManager.hasSave() finds a save from a previous session,
       and wires its click to saveManager.resumeGame(). saveManager.js
       itself owns no DOM (GDD §18.2: "GameState serialization/
       restoration" only) — this markup and its wiring belong to
       main.js, the same split animationManager.js/uiManager.js already
       have (engine-adjacent module drives WHEN, presentation layer owns
       the DOM). -->
  <div id="save-controls" class="save-controls" data-i18n-aria-label="save.controlsLabel">
    <button type="button" id="resume-game-button" class="resume-button" data-i18n="save.resumeButton" hidden>Resume Game</button>
  </div>

  <!-- Orientation gate: populated in Phase 16 -->
  <div id="orientation-gate" class="orientation-gate" hidden>
    <p data-i18n="orientation.rotateDevice">Please rotate your device to landscape.</p>
  </div>

  <!-- Root mount point for the board. uiManager.js owns everything inside this
       node (GDD §19) — it only ever writes into the zone containers below,
       never structurally alters this shell. "Modals" (the 7th GDD §19 zone)
       is deliberately NOT a child here — it lives in the separate
       #modal-root node below, owned by modalManager.js (Prompt 014). -->
  <main id="app-root" class="app-root">
    <section id="zone-opponents" class="zone zone-opponents" aria-label="Opponents" data-i18n-aria-label="zones.opponents"></section>

    <section id="zone-treasure-deck" class="zone zone-treasure-deck" aria-label="Treasure Deck" data-i18n-aria-label="zones.treasureDeck"></section>

    <section id="zone-expedition-area" class="zone zone-expedition-area" aria-label="Expedition Area" data-i18n-aria-label="zones.expeditionArea"></section>

    <section id="zone-lost-loot" class="zone zone-lost-loot" aria-label="Lost Loot" data-i18n-aria-label="zones.lostLoot"></section>

    <section id="zone-actions" class="zone zone-actions" aria-label="Actions" data-i18n-aria-label="zones.actions"></section>

    <section id="zone-ship-cargo" class="zone zone-ship-cargo" aria-label="Ship Cargo" data-i18n-aria-label="zones.shipCargo"></section>
  </main>

  <!-- Modal root: modalManager.js owns everything inside this node -->
  <div id="modal-root" class="modal-root"></div>

  <!-- ES module entry point. Everything else is imported from here. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
